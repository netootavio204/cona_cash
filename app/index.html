<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CONA CASH" />
    <meta name="description" content="CONA CASH — Controle simples e inteligente de entradas, saídas, contas e metas." />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CONA CASH</title>
  </head>
  <body class="bg-[#0B0B0D] text-[#F5F5F7] antialiased selection:bg-[#FF7A1A]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          const isCapacitorNative =
            Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
            window.location.hostname === 'localhost';

          if (isCapacitorNative) {
            // No APK nativo (Capacitor), os arquivos já estão empacotados localmente.
            // Removemos qualquer Service Worker e cache antigo para nunca travar em versão velha após atualizar o APK.
            navigator.serviceWorker.getRegistrations().then((regs) => {
              let hadSw = false;
              Promise.all(
                regs.map((r) => {
                  hadSw = true;
                  return r.unregister();
                })
              ).then(() => {
                if ('caches' in window) {
                  caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))).then(() => {
                    if (hadSw && !sessionStorage.getItem('cona_apk_sw_cleared')) {
                      sessionStorage.setItem('cona_apk_sw_cleared', '1');
                      window.location.reload();
                    }
                  });
                }
              });
            });
          } else {
            navigator.serviceWorker.register('/sw.js').then(
              (reg) => {
                reg.update();
                console.log('[PWA] Service Worker ativo:', reg.scope);
              },
              (err) => console.log('[PWA] Falha ao registrar Service Worker:', err)
            );
          }
        });
      }
    </script>
  </body>
</html>
